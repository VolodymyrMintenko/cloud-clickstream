# ActiveUsers with no window: omitting fromTime and toTime applies neither bound,
# so every retained day is reported (30-day retention is the effective span). The
# fixture spans 2026-09-20 to 2026-09-23, entirely within retention, so this returns
# the same two days as the windowed active_users case — 2026-09-20 (dau 1, wau 1)
# and 2026-09-23 (dau 3, wau 3) — confirming the omitted window defaults to the
# whole retained history.
query ActiveUsersNoWindow {
  ActiveUsers {
    day
    dau
    wau
  }
}
