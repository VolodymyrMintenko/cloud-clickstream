# FR-10: on 2026-09-23 three distinct users are active (dau 3) and, because U1 was
# also active on 2026-09-20 (within the trailing 7 days), wau is the exact distinct
# count over that window = 3 (not additive). 2026-09-20 has dau 1, wau 1.
query ActiveUsersWindow {
  ActiveUsers(
    fromTime: "2026-09-20T00:00:00Z"
    toTime: "2026-09-24T00:00:00Z"
  ) {
    day
    dau
    wau
  }
}
